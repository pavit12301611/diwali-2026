<body>
  <main class="relative h-screen w-full overflow-hidden flex flex-col">

    <!-- Background video -->
    <div class="absolute inset-0 z-0 axon-stage" aria-hidden="true">

      <span class="axon-dot axon-dot--cyan"></span>
      <span class="axon-dot axon-dot--purple"></span>
      <span class="axon-dot axon-dot--amber"></span>

    <!-- Navigation -->
    <header class="relative z-10 flex justify-center pt-4 md:pt-6 px-4">
      <nav class="inline-flex items-center gap-6 md:gap-10 bg-white/70 backdrop-blur-md rounded-xl px-4 md:px-6 py-3 shadow-sm" aria-label="Main">

          <img class="w-8 h-8 rounded-full object-cover shadow-sm" src="/images/axon-logo.png" alt="Axon logo" width="32" height="32">
          <span class="font-['Instrument_Serif'] text-xl tracking-tight text-[#1B133C]">Axon</span>
        </a>
        <div class="hidden sm:flex items-center gap-6">
          <a class="text-sm font-medium text-[#1B133C]/80 hover:text-[#1B133C] transition duration-200" href="#features">Features</a>
          <a class="text-sm font-medium text-[#1B133C]/80 hover:text-[#1B133C] transition duration-200" href="#plans">Plans</a>
          <a class="text-sm font-medium text-[#1B133C]/80 hover:text-[#1B133C] transition duration-200" href="#security">Security</a>
          <a class="text-sm font-medium text-[#1B133C]/80 hover:text-[#1B133C] transition duration-200" href="#about">About</a>
        </div>
      </nav>
    </header>

    <!-- Hero content -->
    <div id="top" class="relative z-10 flex flex-col items-center text-center mt-8 md:mt-16 px-6">
      <div class="mb-6 inline-flex items-center gap-2 rounded-xl border border-[#1B133C]/10 bg-white/70 backdrop-blur-sm px-4 py-2 text-sm font-medium">

      <h1 class="font-['Instrument_Serif'] text-4xl sm:text-5xl md:text-7xl lg:text-8xl leading-[0.95] tracking-tight text-[#1B133C] max-w-4xl">
        Deploy digital workers<br>
        for <em class="italic">mundane workflows</em>
      </h1>

      <p class="mt-5 sm:mt-6 max-w-3xl text-xs sm:text-sm md:text-base leading-relaxed text-[#1B133C]/70">
        Eliminate your tedious browser work and 10x your team's capacity. Put intelligent agents on every routine process so you grow faster and deliver more for clients — effortlessly.
      </p>

      <button type="button" class="mt-7 sm:mt-8 rounded-xl bg-[#FEFEFE] px-6 sm:px-8 py-3 sm:py-3.5 text-sm font-semibold text-[#1B133C] shadow-[0px_4px_12px_rgba(0,0,0,0.15)] hover:shadow-[0px_6px_16px_rgba(0,0,0,0.2)] transition-all duration-300">
        Get Early Access
